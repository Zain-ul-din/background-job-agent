services:
  inngest:
    image: inngest/inngest:v1.49.0
    command:
      [
        "inngest",
        "dev",
        "-p",
        "8288",
        "--sdk-url",
        "http://host.docker.internal:3010/api/inngest",
      ]
    ports:
      - "8288:8288"
    extra_hosts:
      - "host.docker.internal:host-gateway"
